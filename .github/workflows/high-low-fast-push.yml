name: TAIFEX High-Low Fast Push

on:
  schedule:
    # Asia/Taipei: probe at 15:01, then every 5 minutes through 15:31.
    # GitHub only guarantees scheduled workflows at intervals of 5 minutes or longer.
    - cron: "1-31/5 7 * * 1-5"
    # Continue every 5 minutes through 15:56 if TAIFEX publishes later than usual.
    - cron: "36-56/5 7 * * 1-5"
    # Asia/Taipei backup wakeups: 16:02, 16:12, 16:22, 16:32, 16:42, 16:52.
    - cron: "2,12,22,32,42,52 8 * * 1-5"
    # Asia/Taipei late safety wakeups: 17:12 and 17:42.
    - cron: "12,42 9 * * 1-5"
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "External trigger reason."
        required: false
        default: "manual"
      report_date:
        description: "Optional recovery date in YYYY/MM/DD."
        required: false
        default: ""
  repository_dispatch:
    types: [taifex-high-low-fast-push]

concurrency:
  group: taifex-high-low-fast-push
  cancel-in-progress: false

jobs:
  high-low-fast-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether today's high-low screenshots were already delivered
        id: delivery
        env:
          TARGET_REPORT_DATE: ${{ inputs.report_date }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          holidays = {
              "2026/01/01", "2026/02/16", "2026/02/17", "2026/02/18", "2026/02/19",
              "2026/02/20", "2026/02/27", "2026/04/03", "2026/04/06", "2026/05/01",
              "2026/06/19", "2026/09/25", "2026/10/09",
          }

          requested = os.environ.get("TARGET_REPORT_DATE", "").strip()
          current = datetime.now(ZoneInfo("Asia/Taipei"))
          while current.weekday() >= 5 or current.strftime("%Y/%m/%d") in holidays:
              current -= timedelta(days=1)
          expected = requested or current.strftime("%Y/%m/%d")
          slug = expected.replace("/", "-")
          delivery = None

          local_path = Path("snapshots") / f"{slug}.delivery.json"
          if local_path.exists():
              delivery = json.loads(local_path.read_text(encoding="utf-8"))
          else:
              url = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/main/snapshots/{slug}.delivery.json"
              request = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      delivery = json.loads(response.read().decode("utf-8", "ignore"))
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise

          done = bool(delivery and delivery.get("date") == expected and delivery.get("highLowTelegram") is True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"done={'true' if done else 'false'}\n")
              output.write(f"date={expected}\n")
          print(json.dumps({"date": expected, "alreadyDelivered": done, "delivery": delivery}, ensure_ascii=False))
          PY

      - name: Set up Python
        if: steps.delivery.outputs.done != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install report dependencies
        if: steps.delivery.outputs.done != 'true'
        run: pip install -r requirements.txt

      - name: Configure git author
        if: steps.delivery.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish latest snapshot first
        if: steps.delivery.outputs.done != 'true'
        env:
          PUBLIC_BASE_URL: https://taifex-report-dashboard.onrender.com
          REPORT_MAX_RETRIES: "0"
          REPORT_RETRY_DELAY_SECONDS: "0"
          REQUEST_MIN_INTERVAL_SECONDS: "0.35"
          REQUEST_TIMEOUT_SECONDS: "25"
          REQUEST_MAX_RETRIES: "0"
        run: |
          set -o pipefail
          date_args=()
          if [ -n "${{ inputs.report_date }}" ]; then
            date_args=(--date "${{ inputs.report_date }}")
          fi
          python3 send_daily_push.py "${date_args[@]}" --snapshot-only --max-retries 0 --retry-delay 0 2>&1 | tee high-low-snapshot-result.json

      - name: Cache Playwright browsers
        if: steps.delivery.outputs.done != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.59.0-${{ runner.os }}

      - name: Install screenshot dependencies
        if: steps.delivery.outputs.done != 'true'
        run: |
          pip install playwright==1.59.0
          python3 -m playwright install --with-deps chromium

      - name: Send high-low screenshots
        if: steps.delivery.outputs.done != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_BASE_URL: https://taifex-report-dashboard.onrender.com
          REPORT_MAX_RETRIES: "0"
          REPORT_RETRY_DELAY_SECONDS: "20"
          SEND_FULL_TELEGRAM: "0"
          REQUEST_MIN_INTERVAL_SECONDS: "0.35"
          REQUEST_TIMEOUT_SECONDS: "25"
          REQUEST_MAX_RETRIES: "0"
        run: |
          set -o pipefail
          date_args=()
          if [ -n "${{ inputs.report_date }}" ]; then
            date_args=(--date "${{ inputs.report_date }}")
          fi
          python3 send_daily_push.py "${date_args[@]}" --high-low-only --max-retries 0 --retry-delay 20 2>&1 | tee high-low-push-result.json

      - name: Verify high-low delivery
        if: success() && steps.delivery.outputs.done != 'true'
        env:
          TARGET_REPORT_DATE: ${{ inputs.report_date }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          holidays = {
              "2026/01/01", "2026/02/16", "2026/02/17", "2026/02/18", "2026/02/19",
              "2026/02/20", "2026/02/27", "2026/04/03", "2026/04/06", "2026/05/01",
              "2026/06/19", "2026/09/25", "2026/10/09",
          }

          requested = os.environ.get("TARGET_REPORT_DATE", "").strip()
          current = datetime.now(ZoneInfo("Asia/Taipei"))
          while current.weekday() >= 5 or current.strftime("%Y/%m/%d") in holidays:
              current -= timedelta(days=1)
          expected = requested or current.strftime("%Y/%m/%d")
          slug = expected.replace("/", "-")

          def fetch_json(url: str) -> dict:
              req = urllib.request.Request(
                  url,
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache", "User-Agent": "Mozilla/5.0"},
              )
              with urllib.request.urlopen(req, timeout=45) as resp:
                  return json.loads(resp.read().decode("utf-8", "ignore"))

          def fetch_repo_json(path: str) -> dict:
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}?ref=main"
              payload = fetch_json(url)
              return json.loads(base64.b64decode(payload["content"]).decode("utf-8"))

          snapshot = fetch_repo_json(f"snapshots/{slug}.json")
          if snapshot.get("meta", {}).get("date") != expected:
              raise SystemExit(f"snapshot date mismatch: expected {expected}, got {snapshot.get('meta', {}).get('date')}")

          rows = (snapshot.get("changeOverview") or {}).get("highLowAlignmentSummaryRows") or []
          if not rows or rows[0].get("date") != expected:
              raise SystemExit(f"high-low rows not current: expected first row {expected}, got {rows[:1]}")

          required = [
              "futuresBuyTop5SpecificCycle",
              "futuresSellTop5SpecificCycle",
              "futuresBuyTop10SpecificCycle",
              "futuresSellTop10SpecificCycle",
              "foreignFuturesBuyCycle",
              "foreignFuturesSellCycle",
          ]
          missing = [field for field in required if rows[0].get(field) is None]
          if missing:
              raise SystemExit(f"high-low first row missing fields: {missing}")

          delivery = fetch_repo_json(f"snapshots/{slug}.delivery.json")
          if delivery.get("date") != expected or delivery.get("highLowTelegram") is not True:
              raise SystemExit(f"high-low delivery incomplete: {delivery}")

          print(json.dumps({"verifiedHighLowDelivery": expected, "updatedAt": delivery.get("updatedAt")}, ensure_ascii=False))
          PY

      - name: Upload high-low results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-low-fast-push-result
          path: |
            high-low-snapshot-result.json
            high-low-push-result.json
          if-no-files-found: warn

      - name: Alert Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          holidays = {
              "2026/01/01", "2026/02/16", "2026/02/17", "2026/02/18", "2026/02/19",
              "2026/02/20", "2026/02/27", "2026/04/03", "2026/04/06", "2026/05/01",
              "2026/06/19", "2026/09/25", "2026/10/09",
          }

          current = datetime.now(ZoneInfo("Asia/Taipei"))
          trading_day = current
          while trading_day.weekday() >= 5 or trading_day.strftime("%Y/%m/%d") in holidays:
              trading_day -= timedelta(days=1)
          expected = trading_day.strftime("%Y/%m/%d")
          slug = expected.replace("/", "-")

          def fetch_json(url: str) -> dict | None:
              req = urllib.request.Request(
                  url,
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache", "User-Agent": "Mozilla/5.0"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return json.loads(resp.read().decode("utf-8", "ignore"))
              except Exception as exc:
                  print(json.dumps({"deliveryCheck": "failed", "error": str(exc)}, ensure_ascii=False))
                  return None

          delivery = fetch_json(
              f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/main/snapshots/{slug}.delivery.json"
          )
          if delivery and delivery.get("date") == expected and delivery.get("highLowTelegram") is True:
              print(json.dumps({"alert": "skipped", "reason": "delivery_already_complete", "delivery": delivery}, ensure_ascii=False))
              sys.exit(0)

          if current.time() < time(17, 45):
              print(json.dumps({"alert": "skipped", "reason": "before_final_watchdog_window", "date": expected}, ensure_ascii=False))
              sys.exit(0)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          run_url = os.environ["RUN_URL"]
          text = f"TAIFEX High-Low Fast Push 失敗\n請檢查 GitHub Actions：{run_url}"
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              resp.read()
          PY
