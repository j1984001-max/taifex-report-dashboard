name: TAIFEX High-Low Standby

on:
  # Start early enough to survive GitHub's observed schedule delay and wait
  # for the 15:00 release, independently of Cloudflare's public status.
  schedule:
    - cron: "47 0-6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/high_low_standby.py"
      - ".github/workflows/high-low-standby.yml"

concurrency:
  group: taifex-high-low-standby
  cancel-in-progress: true

jobs:
  standby:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install readiness dependencies
        run: pip install -r requirements.txt

      - name: Verify TAIFEX readiness import
        run: python3 -c "from send_daily_push import taifex_source_is_ready; assert callable(taifex_source_is_ready)"

      - name: Wait for TAIFEX release and dispatch fast push
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_MIN_INTERVAL_SECONDS: "0.35"
          REQUEST_TIMEOUT_SECONDS: "15"
          REQUEST_MAX_RETRIES: "1"
          REQUEST_RETRY_BASE_SECONDS: "2"
          STANDBY_SMOKE_TEST: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python3 -u .github/scripts/high_low_standby.py
